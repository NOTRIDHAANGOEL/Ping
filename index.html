<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PING</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7fa;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
}

/* NORMAL WEBSITE */

.nav{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:1px;
}

.nav span{
    color:#777;
    font-size:14px;
}

.hero{
    min-height:calc(100vh - 65px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.content{
    max-width:650px;
}

.content h1{
    font-size:55px;
    margin:0 0 15px;
}

.content p{
    color:#666;
    font-size:19px;
    line-height:1.6;
}

.fakeButton{
    display:inline-block;
    margin-top:20px;
    padding:13px 25px;
    background:#171717;
    color:white;
    border-radius:8px;
}

/* JUMPSCARE */

#scare{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
    overflow:hidden;
}

.scareFace{
    position:absolute;
    left:50%;
    top:50%;
    width:330px;
    height:390px;
    transform:translate(-50%,-50%);
    background:#d8d8d8;
    border-radius:48% 48% 45% 45%;
    box-shadow:0 0 80px #fff;
}

.eye{
    position:absolute;
    top:105px;
    width:65px;
    height:85px;
    background:#111;
    border-radius:50%;
}

.eye:after{
    content:"";
    position:absolute;
    width:18px;
    height:25px;
    background:white;
    border-radius:50%;
    left:23px;
    top:15px;
}

.eye.left{left:55px}
.eye.right{right:55px}

.mouth{
    position:absolute;
    left:65px;
    right:65px;
    bottom:55px;
    height:110px;
    background:#080808;
    border-radius:10px 10px 50% 50%;
    box-shadow:inset 0 0 0 5px #333;
}

.mouth:before{
    content:"";
    position:absolute;
    top:8px;
    left:20px;
    right:20px;
    height:25px;
    background:white;
    border-radius:3px;
}

.nose{
    position:absolute;
    left:145px;
    top:175px;
    width:40px;
    height:55px;
    border-left:6px solid #999;
    border-bottom:6px solid #999;
    transform:rotate(-20deg);
}

.scareText{
    position:absolute;
    bottom:7%;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(40px,8vw,90px);
    font-weight:900;
    letter-spacing:3px;
}

/* FINAL */

#final{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    background:#000;
    color:white;
    text-align:center;
    padding-top:18vh;
}

#final h1{
    font-size:clamp(60px,13vw,150px);
    margin:0;
    font-weight:1000;
    animation:shake .08s infinite;
}

#final h2{
    font-size:clamp(20px,4vw,36px);
}

#final p{
    font-size:22px;
    font-weight:bold;
}

@keyframes shake{
    0%{transform:translate(-5px,2px) rotate(-1deg)}
    50%{transform:translate(5px,-2px) rotate(1deg)}
    100%{transform:translate(-4px,1px) rotate(-1deg)}
}

.shaking{
    animation:screenShake .07s infinite;
}

@keyframes screenShake{
    0%{transform:translate(0)}
    25%{transform:translate(8px,-5px)}
    50%{transform:translate(-7px,5px)}
    75%{transform:translate(5px,4px)}
    100%{transform:translate(-4px,-3px)}
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    z-index:10001;
    animation:flash .35s forwards;
}

@keyframes flash{
    0%{opacity:1}
    100%{opacity:0}
}
</style>
</head>

<body>

<div id="normal">

    <div class="nav">
        <div class="logo">PING</div>
        <span>Simple. Fast. Reliable.</span>
    </div>

    <div class="hero">
        <div class="content">

            <h1>Welcome to PING</h1>

            <p>
                A simple place to check your connection,
                discover useful tools, and stay connected.
            </p>

            <div class="fakeButton">
                Check Connection
            </div>

        </div>
    </div>

</div>

<div id="scare">

    <div class="scareFace">

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="nose"></div>

        <div class="mouth"></div>

    </div>

    <div class="scareText">
        PING!
    </div>

</div>

<div id="final">

    <h1>TAKE THE L 💀</h1>

    <h2>YOU REALLY THOUGHT THIS WAS A NORMAL WEBSITE 😭</h2>

    <p>WE'LL MEET IN SCHOOL 🗿</p>

</div>

<script>

setTimeout(function(){

    const scare=document.getElementById("scare");

    scare.style.display="block";

    document.body.classList.add("shaking");

    const flash=document.createElement("div");

    flash.className="flash";

    document.body.appendChild(flash);

    /* Moderate scare sound */

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio=new AudioContext();

        const oscillator=audio.createOscillator();
        const gain=audio.createGain();

        oscillator.type="sawtooth";

        oscillator.frequency.setValueAtTime(
            180,
            audio.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            70,
            audio.currentTime+0.45
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        gain.gain.setValueAtTime(
            0.0001,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.16,
            audio.currentTime+0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audio.currentTime+0.5
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime+0.55
        );

    }catch(e){

        console.log("Sound unavailable");

    }

    setTimeout(function(){

        scare.style.display="none";

        document.body.classList.remove("shaking");

        document.getElementById("final").style.display="block";

        document.title="TAKE THE L 💀";

    },1800);

},7000);

</script>

</body>
</html>
