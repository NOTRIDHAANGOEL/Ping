<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying...</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* LOADING */

#loading {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.box {
    width: 90%;
    max-width: 500px;
}

h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.small {
    color: #888;
    margin-bottom: 25px;
}

.bar {
    width: 100%;
    height: 14px;
    background: #222;
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: white;
    transition: width .2s;
}

#percent {
    margin-top: 12px;
    color: #777;
}

/* TROLL */

#troll {
    display: none;
    height: 100vh;
    position: relative;
    background: #000;
    text-align: center;
    overflow: hidden;
}

.trollText {
    position: relative;
    z-index: 5;
    padding-top: 8vh;
}

.trollText h1 {
    margin: 0;
    font-size: clamp(65px, 13vw, 150px);
    font-weight: 1000;
    letter-spacing: -6px;
    animation: shake .08s infinite;
}

.trollText p {
    font-size: 25px;
    font-weight: bold;
}

/* Dancing character */

.dancer {
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    font-size: 150px;
    animation: dance .35s infinite alternate ease-in-out;
}

@keyframes dance {
    0% {
        transform: translateX(-50%) rotate(-15deg) translateY(0);
    }

    100% {
        transform: translateX(-50%) rotate(15deg) translateY(-35px);
    }
}

@keyframes shake {
    0% { transform: translateX(-4px) rotate(-1deg); }
    50% { transform: translateX(4px) rotate(1deg); }
    100% { transform: translateX(-4px) rotate(-1deg); }
}

/* Confetti */

.confetti {
    position: absolute;
    width: 12px;
    height: 12px;
    animation: fall 2s linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-100px) rotate(0deg);
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<!-- FAKE LOADING -->

<div id="loading">
    <div class="box">

        <h2 id="title">Verifying you're human...</h2>

        <div class="small" id="status">
            Please wait...
        </div>

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="percent">0%</div>

    </div>
</div>


<!-- TROLL SCREEN -->

<div id="troll">

    <div class="trollText">
        <h1>TAKE THE L 💀</h1>
        <p>YOU JUST WASTED YOUR TIME BRO 😭</p>
    </div>

    <div class="dancer">🕺</div>

</div>


<script>

let progress = 0;

const progressBar = document.getElementById("progress");
const percent = document.getElementById("percent");
const title = document.getElementById("title");
const status = document.getElementById("status");

const messages = [
    ["Verifying you're human...", "Checking browser..."],
    ["Scanning...", "Almost done..."],
    ["Analyzing absolutely nothing...", "Please continue waiting 💀"],
    ["99% complete...", "DO NOT CLOSE THIS PAGE"],
    ["Final verification...", "One last thing..."]
];

let messageIndex = 0;

const interval = setInterval(() => {

    progress++;

    progressBar.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress % 20 === 0 && messageIndex < messages.length) {
        title.textContent = messages[messageIndex][0];
        status.textContent = messages[messageIndex][1];
        messageIndex++;
    }

    if (progress >= 100) {

        clearInterval(interval);

        setTimeout(() => {

            document.getElementById("loading").style.display = "none";
            document.getElementById("troll").style.display = "block";

            document.title = "TAKE THE L 💀";

            makeConfetti();

        }, 1200);
    }

}, 70);


/* CONFETTI */

function makeConfetti() {

    for (let i = 0; i < 100; i++) {

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.top = Math.random() * -100 + "px";

        piece.style.animationDelay =
            Math.random() * 2 + "s";

        piece.style.background =
            ["white", "#888", "#aaa", "#444"][Math.floor(Math.random() * 4)];

        document.getElementById("troll").appendChild(piece);
    }
}

</script>

</body>
</html>
