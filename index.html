<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verifying...</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* LOADING */

#loading{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.box{
    width:88%;
    max-width:520px;
}

.box h2{
    font-size:28px;
    margin-bottom:12px;
}

.status{
    color:#888;
    margin-bottom:25px;
}

.bar{
    width:100%;
    height:16px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:white;
    transition:width .15s;
}

.percent{
    margin-top:12px;
    color:#777;
}

/* TROLL */

#troll{
    display:none;
    height:100vh;
    position:relative;
    overflow:hidden;
    text-align:center;
    background:#000;
}

.title{
    position:relative;
    z-index:10;
    padding:7vh 15px 0;
}

.title h1{
    margin:0;
    font-size:clamp(55px,13vw,150px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-6px;
    animation:shake .07s infinite;
}

.title h2{
    font-size:clamp(22px,5vw,42px);
    margin:25px 0 8px;
}

.title p{
    font-size:22px;
    font-weight:bold;
    margin:0;
}

/* CSS DANCER */

.dancer{
    position:absolute;
    left:50%;
    bottom:4%;
    width:150px;
    height:230px;
    transform:translateX(-50%);
    animation:bounce .35s infinite alternate ease-in-out;
}

.head{
    position:absolute;
    width:65px;
    height:65px;
    border:6px solid white;
    border-radius:50%;
    left:42px;
    top:0;
}

.body{
    position:absolute;
    width:8px;
    height:100px;
    background:white;
    left:71px;
    top:62px;
}

.arm{
    position:absolute;
    width:8px;
    height:80px;
    background:white;
    top:70px;
    transform-origin:top;
}

.arm.left{
    left:70px;
    transform:rotate(55deg);
}

.arm.right{
    left:74px;
    transform:rotate(-55deg);
}

.leg{
    position:absolute;
    width:8px;
    height:100px;
    background:white;
    top:150px;
    transform-origin:top;
}

.leg.left{
    left:70px;
    transform:rotate(35deg);
}

.leg.right{
    left:74px;
    transform:rotate(-35deg);
}

@keyframes bounce{
    from{transform:translateX(-50%) rotate(-8deg) translateY(0)}
    to{transform:translateX(-50%) rotate(8deg) translateY(-30px)}
}

@keyframes shake{
    0%{transform:translateX(-5px) rotate(-1deg)}
    50%{transform:translateX(5px) rotate(1deg)}
    100%{transform:translateX(-5px) rotate(-1deg)}
}

/* CONFETTI */

.confetti{
    position:absolute;
    width:12px;
    height:12px;
    animation:fall 2s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-30px) rotate(0);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* FLASH */

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:20;
    animation:flash .5s ease;
}

@keyframes flash{
    0%{opacity:.9}
    100%{opacity:0}
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->

<div id="loading">
    <div class="box">

        <h2 id="loadingTitle">Verifying you're human...</h2>

        <div class="status" id="status">
            Please wait...
        </div>

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="percent" id="percent">0%</div>

    </div>
</div>


<!-- TROLL SCREEN -->

<div id="troll">

    <div class="title">

        <h1>TAKE THE L 💀</h1>

        <h2>YOU JUST WASTED YOUR TIME 😭</h2>

        <p>WELL MEET ME IN SCHOOL 🗿</p>

    </div>


    <!-- DANCING STICK FIGURE -->

    <div class="dancer">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

</div>


<script>

/* LOADING */

let progress=0;
let messageIndex=0;

const progressBar=document.getElementById("progress");
const percent=document.getElementById("percent");
const loadingTitle=document.getElementById("loadingTitle");
const status=document.getElementById("status");

const messages=[
    ["Verifying you're human...","Checking browser..."],
    ["Scanning...","Almost finished..."],
    ["Analyzing device...","This may take a moment..."],
    ["99% complete...","DO NOT CLOSE THIS PAGE 💀"],
    ["Final verification...","One last thing..."]
];

const interval=setInterval(()=>{

    progress++;

    progressBar.style.width=progress+"%";
    percent.textContent=progress+"%";

    if(progress%20===0 && messageIndex<messages.length){

        loadingTitle.textContent=messages[messageIndex][0];
        status.textContent=messages[messageIndex][1];

        messageIndex++;
    }

    if(progress>=100){

        clearInterval(interval);

        setTimeout(reveal,900);
    }

},70);


/* REVEAL */

function reveal(){

    document.getElementById("loading").style.display="none";

    const troll=document.getElementById("troll");
    troll.style.display="block";

    document.title="TAKE THE L 💀";

    const flash=document.createElement("div");
    flash.className="flash";
    troll.appendChild(flash);

    makeConfetti();

    playTrollSound();
}


/* CONFETTI */

function makeConfetti(){

    for(let i=0;i<120;i++){

        const piece=document.createElement("div");

        piece.className="confetti";

        piece.style.left=Math.random()*100+"vw";

        piece.style.top="-20px";

        piece.style.background=
            ["white","#aaa","#777","#444"][Math.floor(Math.random()*4)];

        piece.style.animationDelay=
            Math.random()*1.5+"s";

        document.getElementById("troll").appendChild(piece);
    }
}


/* BROWSER-GENERATED TROLL BEAT */

function playTrollSound(){

    try{

        const AudioContext=
            window.AudioContext ||
            window.webkitAudioContext;

        const audio=new AudioContext();

        const notes=[
            220,220,330,220,
            165,165,247,165,
            220,220,330,440
        ];

        notes.forEach((frequency,index)=>{

            const oscillator=audio.createOscillator();
            const gain=audio.createGain();

            oscillator.type="square";
            oscillator.frequency.value=frequency;

            oscillator.connect(gain);
            gain.connect(audio.destination);

            const start=audio.currentTime+(index*0.16);

            gain.gain.setValueAtTime(0.0001,start);
            gain.gain.exponentialRampToValueAtTime(
                0.12,start+0.01
            );
            gain.gain.exponentialRampToValueAtTime(
                0.0001,start+0.13
            );

            oscillator.start(start);
            oscillator.stop(start+0.14);

        });

    }catch(e){

        console.log("Audio unavailable");

    }
}

</script>

</body>
</html>
